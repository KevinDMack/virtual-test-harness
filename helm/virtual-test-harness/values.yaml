# Default values for virtual-test-harness.
# Override these per-instance when installing multiple releases.

# -- Number of simulator pod replicas.
replicaCount: 1

image:
  # -- Full image reference (registry/name:tag).
  repository: myregistry.azurecr.io/virtual-test-harness
  # -- Image pull policy.
  pullPolicy: IfNotPresent
  # -- Image tag. Overrides the chart appVersion when set.
  tag: "latest"

# -- Names of Kubernetes image pull secrets.
imagePullSecrets:
  - name: acr-pull-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # -- Whether to create a service account.
  create: true
  # -- Annotations to add to the service account (e.g. for Workload Identity).
  annotations: {}
  # -- Name of the service account. Auto-generated if empty.
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext:
  runAsNonRoot: true
  runAsUser: 65534  # nobody

resources:
  requests:
    cpu: "100m"
    memory: "64Mi"
  limits:
    cpu: "250m"
    memory: "128Mi"

# -- Sensor simulator configuration.
# These values are rendered into a ConfigMap and mounted at /app/config/config.json.
config:
  sensor_name: "sensor-alpha-01"
  message_interval: 5
  message_topic: "sensor-data"
  health_interval: 30
  health_topic: "sensor-health"
  run_continuous: true
  # -- Message bus back-end: "servicebus" or "mqtt"
  message_bus_type: "servicebus"

  # -- Azure Service Bus settings (required when message_bus_type is "servicebus")
  service_bus_namespace: "your-namespace.servicebus.windows.net"

  # -- MQTT settings (required when message_bus_type is "mqtt")
  # mqtt_broker_host: "mosquitto"
  # mqtt_broker_port: 1883
  # mqtt_client_id: ""      # defaults to sensor_name
  # mqtt_username: ""
  # mqtt_password: ""
  # mqtt_use_tls: false
  # mqtt_qos: 1

# -- MQTT broker (Eclipse Mosquitto) sidecar/co-located pod.
# Enable this to deploy a Mosquitto broker in the same namespace as the
# simulator.  Useful for MQTT-mode deployments that do not have an external broker.
mqtt:
  broker:
    # -- Deploy the Mosquitto broker Deployment + Service + ConfigMap.
    enabled: false
    image:
      repository: eclipse-mosquitto
      tag: "2.0.18"
      pullPolicy: IfNotPresent
    # -- MQTT TCP listener port.
    port: 1883
    # -- WebSocket listener port. Set to 0 to disable.
    wsPort: 9001
    persistence:
      # -- Mount a PersistentVolumeClaim for broker data persistence.
      enabled: false
      # -- PVC size when persistence is enabled.
      size: 1Gi
    resources:
      requests:
        cpu: "50m"
        memory: "32Mi"
      limits:
        cpu: "100m"
        memory: "64Mi"
    # -- Allow unauthenticated connections to the broker.
    # Set to false and configure mqtt.broker.extraConfig with password_file
    # and per-user ACLs for production deployments.
    allowAnonymous: true
    # -- Extra lines appended verbatim to mosquitto.conf (e.g. auth settings).
    extraConfig: ""

# -- Inbox messages.
# Keys map to filenames; values are JSON arrays or objects (as YAML).
# Each key will be written as a separate JSON file inside /app/inbox/.
inbox:
  messages.json: |
    [
      {
        "reading_type": "temperature",
        "value": 72.4,
        "unit": "fahrenheit",
        "location": "sector-7G"
      },
      {
        "reading_type": "humidity",
        "value": 58.1,
        "unit": "percent",
        "location": "sector-7G"
      }
    ]

# -- If true, mount config and inbox from external PersistentVolumeClaims
#    instead of ConfigMaps.  Set pvcNames accordingly.
useExternalVolumes: false
pvcNames:
  config: ""
  inbox: ""

nodeSelector: {}

tolerations: []

affinity: {}

# -- Log volume configuration.
# Telemetry logs are written to /logs/app.log inside the container and picked
# up by Arc and monitoring services (e.g. Azure Monitor Agent, Fluent Bit).
# By default an emptyDir volume is used so the logs are accessible to any
# log-scraping sidecar or DaemonSet on the same node.
# Enable persistence to retain logs across pod restarts via a PVC.
logs:
  persistence:
    # -- When true, back the /logs mount with a PersistentVolumeClaim.
    enabled: false
    # -- Use an existing PVC instead of creating one. Leave empty to auto-create.
    existingClaim: ""
    # -- Storage class for the auto-created PVC. Leave empty to use the cluster default.
    storageClass: ""
    # -- Size of the auto-created PVC.
    size: 1Gi
