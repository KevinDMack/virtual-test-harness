apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "virtual-test-harness.fullname" . }}
  labels:
    {{- include "virtual-test-harness.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "virtual-test-harness.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "virtual-test-harness.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "virtual-test-harness.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: CONFIG_PATH
              value: /app/config/config.json
            - name: INBOX_DIR
              value: /app/inbox
            - name: LOG_DIR
              value: /logs
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
              readOnly: true
            - name: inbox-volume
              mountPath: /app/inbox
              readOnly: true
            - name: logs-volume
              mountPath: /logs
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- if .Values.useExternalVolumes }}
        - name: config-volume
          persistentVolumeClaim:
            claimName: {{ .Values.pvcNames.config }}
        - name: inbox-volume
          persistentVolumeClaim:
            claimName: {{ .Values.pvcNames.inbox }}
        {{- else }}
        - name: config-volume
          configMap:
            name: {{ include "virtual-test-harness.fullname" . }}-config
        - name: inbox-volume
          configMap:
            name: {{ include "virtual-test-harness.fullname" . }}-inbox
        {{- end }}
        - name: logs-volume
          {{- if .Values.logs.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.logs.persistence.existingClaim | default (printf "%s-logs" (include "virtual-test-harness.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
