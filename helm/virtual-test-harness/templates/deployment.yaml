{{- if .Values.sensors }}
{{- range .Values.sensors }}
{{- $sensor := . }}
{{- $ctx := $ }}
{{- $sensorFullname := printf "%s-%s" (include "virtual-test-harness.fullname" $ctx) $sensor.name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $sensorFullname }}
  labels:
    {{- include "virtual-test-harness.labels" $ctx | nindent 4 }}
    app.kubernetes.io/component: {{ $sensor.name }}
spec:
  replicas: {{ $sensor.replicaCount | default $ctx.Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "virtual-test-harness.selectorLabels" $ctx | nindent 6 }}
      app.kubernetes.io/component: {{ $sensor.name }}
  template:
    metadata:
      {{- with $ctx.Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "virtual-test-harness.selectorLabels" $ctx | nindent 8 }}
        app.kubernetes.io/component: {{ $sensor.name }}
    spec:
      {{- with $ctx.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "virtual-test-harness.serviceAccountName" $ctx }}
      {{- with $ctx.Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $ctx.Chart.Name }}
          {{- with $ctx.Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ $ctx.Values.image.repository }}:{{ $ctx.Values.image.tag | default $ctx.Chart.AppVersion }}"
          imagePullPolicy: {{ $ctx.Values.image.pullPolicy }}
          env:
            - name: CONFIG_PATH
              value: /app/config/config.json
            - name: INBOX_DIR
              value: /app/inbox
            - name: LOG_DIR
              value: /logs
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
              readOnly: true
            - name: inbox-volume
              mountPath: /app/inbox
              readOnly: true
            - name: logs-volume
              mountPath: /logs
          resources:
            {{- toYaml ($sensor.resources | default $ctx.Values.resources) | nindent 12 }}
      volumes:
        {{- if $ctx.Values.useExternalVolumes }}
        - name: config-volume
          persistentVolumeClaim:
            claimName: {{ ($sensor.pvcNames).config | default $ctx.Values.pvcNames.config }}
        - name: inbox-volume
          persistentVolumeClaim:
            claimName: {{ ($sensor.pvcNames).inbox | default $ctx.Values.pvcNames.inbox }}
        {{- else }}
        - name: config-volume
          configMap:
            name: {{ $sensorFullname }}-config
        - name: inbox-volume
          configMap:
            name: {{ $sensorFullname }}-inbox
        {{- end }}
        - name: logs-volume
          {{- if $ctx.Values.logs.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $ctx.Values.logs.persistence.existingClaim | default (printf "%s-logs" $sensorFullname) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with $ctx.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $ctx.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $ctx.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- else }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "virtual-test-harness.fullname" . }}
  labels:
    {{- include "virtual-test-harness.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "virtual-test-harness.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "virtual-test-harness.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "virtual-test-harness.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: CONFIG_PATH
              value: /app/config/config.json
            - name: INBOX_DIR
              value: /app/inbox
            - name: LOG_DIR
              value: /logs
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
              readOnly: true
            - name: inbox-volume
              mountPath: /app/inbox
              readOnly: true
            - name: logs-volume
              mountPath: /logs
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- if .Values.useExternalVolumes }}
        - name: config-volume
          persistentVolumeClaim:
            claimName: {{ .Values.pvcNames.config }}
        - name: inbox-volume
          persistentVolumeClaim:
            claimName: {{ .Values.pvcNames.inbox }}
        {{- else }}
        - name: config-volume
          configMap:
            name: {{ include "virtual-test-harness.fullname" . }}-config
        - name: inbox-volume
          configMap:
            name: {{ include "virtual-test-harness.fullname" . }}-inbox
        {{- end }}
        - name: logs-volume
          {{- if .Values.logs.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.logs.persistence.existingClaim | default (printf "%s-logs" (include "virtual-test-harness.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
