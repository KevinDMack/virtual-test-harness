{{- if .Values.mqtt.broker.enabled }}
---
# ConfigMap: Mosquitto broker configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "virtual-test-harness.fullname" . }}-mqtt-broker-config
  labels:
    {{- include "virtual-test-harness.labels" . | nindent 4 }}
data:
  mosquitto.conf: |
    # Generated by Helm – do not edit directly.
    listener {{ .Values.mqtt.broker.port }}
    allow_anonymous {{ .Values.mqtt.broker.allowAnonymous }}
    {{- if gt (int .Values.mqtt.broker.wsPort) 0 }}
    listener {{ .Values.mqtt.broker.wsPort }}
    protocol websockets
    {{- end }}
    {{- if .Values.mqtt.broker.persistence.enabled }}
    persistence true
    persistence_location /mosquitto/data/
    {{- else }}
    persistence false
    {{- end }}
    log_dest stdout
    {{- if .Values.mqtt.broker.extraConfig }}
    {{ .Values.mqtt.broker.extraConfig | nindent 4 }}
    {{- end }}
---
# Service: exposes the Mosquitto broker within the cluster
apiVersion: v1
kind: Service
metadata:
  name: {{ include "virtual-test-harness.fullname" . }}-mqtt-broker
  labels:
    {{- include "virtual-test-harness.labels" . | nindent 4 }}
    app.kubernetes.io/component: mqtt-broker
spec:
  type: ClusterIP
  selector:
    {{- include "virtual-test-harness.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mqtt-broker
  ports:
    - name: mqtt
      port: {{ .Values.mqtt.broker.port }}
      targetPort: mqtt
      protocol: TCP
    {{- if gt (int .Values.mqtt.broker.wsPort) 0 }}
    - name: mqtt-ws
      port: {{ .Values.mqtt.broker.wsPort }}
      targetPort: mqtt-ws
      protocol: TCP
    {{- end }}
---
# Deployment: Mosquitto broker pod
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "virtual-test-harness.fullname" . }}-mqtt-broker
  labels:
    {{- include "virtual-test-harness.labels" . | nindent 4 }}
    app.kubernetes.io/component: mqtt-broker
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "virtual-test-harness.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mqtt-broker
  template:
    metadata:
      labels:
        {{- include "virtual-test-harness.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mqtt-broker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1883
      containers:
        - name: mosquitto
          image: "{{ .Values.mqtt.broker.image.repository }}:{{ .Values.mqtt.broker.image.tag }}"
          imagePullPolicy: {{ .Values.mqtt.broker.image.pullPolicy }}
          ports:
            - name: mqtt
              containerPort: {{ .Values.mqtt.broker.port }}
              protocol: TCP
            {{- if gt (int .Values.mqtt.broker.wsPort) 0 }}
            - name: mqtt-ws
              containerPort: {{ .Values.mqtt.broker.wsPort }}
              protocol: TCP
            {{- end }}
          volumeMounts:
            - name: mosquitto-config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
              readOnly: true
            {{- if .Values.mqtt.broker.persistence.enabled }}
            - name: mosquitto-data
              mountPath: /mosquitto/data
            {{- end }}
          resources:
            {{- toYaml .Values.mqtt.broker.resources | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: mosquitto-config
          configMap:
            name: {{ include "virtual-test-harness.fullname" . }}-mqtt-broker-config
        {{- if .Values.mqtt.broker.persistence.enabled }}
        - name: mosquitto-data
          persistentVolumeClaim:
            claimName: {{ include "virtual-test-harness.fullname" . }}-mqtt-broker-data
        {{- end }}
---
{{- if .Values.mqtt.broker.persistence.enabled }}
# PersistentVolumeClaim: broker data storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "virtual-test-harness.fullname" . }}-mqtt-broker-data
  labels:
    {{- include "virtual-test-harness.labels" . | nindent 4 }}
    app.kubernetes.io/component: mqtt-broker
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.mqtt.broker.persistence.size }}
{{- end }}
{{- end }}
