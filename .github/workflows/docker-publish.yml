name: Build and Publish Docker Image

on:
  push:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the latest semver tag from the repository
          LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)

          # Find the PR that introduced this merge commit
          PR_NUMBER=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[0].number // empty' 2>/dev/null || true)

          BUMP_TYPE="patch"
          ISSUE_NUMBER=""
          ISSUE_TITLE=""

          if [ -n "$PR_NUMBER" ]; then
            PR_BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body // ""' 2>/dev/null || true)
            # Parse "Closes/Fixes/Resolves #N" references from the PR body
            ISSUE_NUMBER=$(echo "$PR_BODY" | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+' \
              | grep -oE '[0-9]+' | head -1 || true)

            if [ -n "$ISSUE_NUMBER" ]; then
              ISSUE_LABELS=$(gh issue view "$ISSUE_NUMBER" --json labels \
                --jq '[.labels[].name] | join(",")' 2>/dev/null || true)
              ISSUE_TITLE=$(gh issue view "$ISSUE_NUMBER" --json title \
                --jq '.title' 2>/dev/null || true)
              gh issue view "$ISSUE_NUMBER" --json body \
                --jq '.body // ""' > /tmp/issue_body.txt 2>/dev/null || touch /tmp/issue_body.txt

              if echo "$ISSUE_LABELS" | grep -qi "enhancement"; then
                BUMP_TYPE="minor"
              fi
            fi
          fi

          # Calculate the new version
          if [ -z "$LATEST_TAG" ]; then
            NEW_VERSION="v0.1.0"
          else
            MAJOR=$(echo "$LATEST_TAG" | sed 's/v//' | cut -d. -f1)
            MINOR=$(echo "$LATEST_TAG" | sed 's/v//' | cut -d. -f2)
            PATCH=$(echo "$LATEST_TAG" | sed 's/v//' | cut -d. -f3)

            if [ "$BUMP_TYPE" = "minor" ]; then
              MINOR=$((MINOR + 1))
              PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi

            NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "issue_number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "issue_title=${ISSUE_TITLE}" >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.version }}" "${{ github.sha }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          ISSUE_NUMBER: ${{ steps.version.outputs.issue_number }}
          ISSUE_TITLE: ${{ steps.version.outputs.issue_title }}
        run: |
          if [ -n "$ISSUE_NUMBER" ]; then
            RELEASE_TITLE="${VERSION}: ${ISSUE_TITLE}"
            {
              echo "## Linked Issue"
              echo ""
              echo "Closes #${ISSUE_NUMBER}"
              if [ -s /tmp/issue_body.txt ]; then
                echo ""
                cat /tmp/issue_body.txt
              fi
            } > /tmp/release_notes.txt
          else
            RELEASE_TITLE="${VERSION}"
            echo "Automated release ${VERSION}" > /tmp/release_notes.txt
          fi

          gh release create "$VERSION" \
            --title "$RELEASE_TITLE" \
            --notes-file /tmp/release_notes.txt \
            --target "${{ github.sha }}"
